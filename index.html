<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocab Mini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F3EA;
    --paper-card:#FFFDF8;
    --ink:#1C1B29;
    --ink-soft:#4A4859;
    --rule:#DCD4BE;
    --brass:#A8823D;
    --brass-dark:#8A6B2F;
    --amber-select:#FFD873;
    --amber-word:#FBEEC3;
    --green:#3C6E52;
    --green-bg:#E4EFE7;
    --red:#A63D40;
    --red-bg:#F6E4E3;
    --shadow: 0 1px 2px rgba(28,27,41,0.06), 0 8px 24px rgba(28,27,41,0.08);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(28,27,41,0.045) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 28px 16px 60px;
    -webkit-font-smoothing: antialiased;
  }

  .app{
    width:100%;
    max-width: 460px;
  }

  /* ---------- Header ---------- */
  header{
    text-align:center;
    margin-bottom: 18px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:700;
    font-size: 36px;
    margin:0;
    letter-spacing: -0.01em;
  }
  .date{
    font-size:13px;
    color: var(--ink-soft);
    margin-top:4px;
  }

  /* ---------- Status bar ---------- */
  .statusbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: var(--paper-card);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .timer{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    font-variant-numeric: tabular-nums;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .timer svg{width:15px;height:15px;opacity:0.55;}
  .statusbar .actions{display:flex; gap:8px;}
  .iconbtn{
    background:none;
    border:1px solid var(--rule);
    border-radius:7px;
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color: var(--ink);
    transition: background 0.15s, border-color 0.15s;
  }
  /* [hidden] is display:none in the UA sheet, but .iconbtn's display:flex
     wins on specificity — without this the "back to today" button stays
     visible on today's puzzle, which is exactly when it does nothing. */
  .iconbtn[hidden]{ display:none; }
  .iconbtn:hover{ background: var(--paper); border-color: var(--brass); }
  .iconbtn svg{width:16px;height:16px;}

  /* ---------- Grid ---------- */
  .grid-wrap{
    position:relative;
    background: var(--paper-card);
    border-radius: 12px;
    padding: 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--rule);
    margin-bottom: 18px;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 3px;
    aspect-ratio: 1 / 1;
    background: var(--ink);
    border-radius: 4px;
    overflow:hidden;
  }
  .cell{
    position:relative;
    background: var(--paper-card);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  .cell.black{
    background: var(--ink);
    cursor:default;
  }
  .cell .num{
    position:absolute;
    top: 3px; left: 4px;
    font-size: 10px;
    font-weight: 700;
    color: var(--brass-dark);
    font-family:'Inter',sans-serif;
  }
  .cell .letter{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: clamp(20px, 6vw, 28px);
    color: var(--ink);
    line-height:1;
    text-transform:uppercase;
  }
  .cell.word-hl{ background: var(--amber-word); }
  .cell.selected{ background: var(--amber-select); }
  .cell.correct .letter{ color: var(--green); }
  .cell.correct{ background: var(--green-bg); }
  .cell.incorrect .letter{ color: var(--red); }
  .cell.incorrect{ background: var(--red-bg); }
  .cell.revealed .letter{ color: var(--brass-dark); }

  /* ---------- Clue rail (currently active clue) ---------- */
  .active-clue{
    display:flex;
    align-items:center;
    gap:10px;
    background: var(--paper-card);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 11px 14px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .active-clue .dir-toggle{
    flex-shrink:0;
    width:30px;height:30px;
    border-radius:7px;
    background: var(--ink);
    color: var(--paper-card);
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:13px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .active-clue .text{
    font-size:15px;
    font-weight:500;
  }
  .active-clue .text b{
    font-weight:700;
    color: var(--brass-dark);
    margin-right:2px;
  }
  .active-clue .nav{
    margin-left:auto;
    display:flex;
    gap:4px;
  }
  .active-clue .nav button{
    border:none;
    background: var(--paper);
    border-radius:6px;
    width:26px;height:26px;
    cursor:pointer;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
  }
  .active-clue .nav button:hover{ background: var(--amber-word); }

  /* ---------- Controls ---------- */
  .controls{
    display:flex;
    gap:8px;
    margin-bottom: 22px;
  }
  .controls button{
    flex:1;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    padding: 10px 8px;
    border-radius:8px;
    border:1px solid var(--rule);
    background: var(--paper-card);
    color: var(--ink);
    cursor:pointer;
    transition: transform 0.08s, background 0.15s;
  }
  .controls button:hover{ background: var(--amber-word); border-color: var(--brass); }
  .controls button:active{ transform: scale(0.97); }
  .controls button.primary{
    background: var(--ink);
    color: var(--paper-card);
    border-color: var(--ink);
  }
  .controls button.primary:hover{ background:#33314A; }

  /* ---------- Clue lists ---------- */
  .clue-columns{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .clue-col h2{
    font-family:'Fraunces',serif;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: var(--brass-dark);
    margin: 0 0 8px;
    padding-bottom:6px;
    border-bottom: 1px solid var(--rule);
  }
  .clue-item{
    display:flex;
    gap:7px;
    font-size:13.5px;
    line-height:1.4;
    padding: 6px 6px;
    border-radius:6px;
    cursor:pointer;
    color: var(--ink-soft);
  }
  .clue-item b{
    color: var(--ink);
    font-weight:700;
    min-width: 15px;
  }
  .clue-item:hover{ background: var(--paper); }
  .clue-item.active{
    background: var(--amber-word);
    color: var(--ink);
  }
  .clue-item.done{
    color: var(--green);
    text-decoration: line-through;
    text-decoration-color: var(--green);
    opacity: 0.75;
  }

  /* ---------- Stamp overlay ---------- */
  .share-row{
    display:flex;
    justify-content:center;
    margin: 0 0 16px;
  }
  /* Same specificity trap as .iconbtn: [hidden] is display:none in the UA
     sheet, but display:flex here would beat it and the button would show
     before the puzzle is solved. */
  .share-row[hidden]{ display:none; }
  .sharebtn{
    display:flex; align-items:center; gap:8px;
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    padding: 10px 18px;
    border-radius:8px;
    border:1px solid var(--green);
    background: var(--paper-card);
    color: var(--green);
    cursor:pointer;
    transition: background 0.15s, transform 0.08s;
  }
  .sharebtn:hover{ background: rgba(47,110,79,0.07); }
  .sharebtn:active{ transform: translateY(1px); }
  .sharebtn svg{ width:15px; height:15px; }

  .stamp{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    opacity:0;
  }
  .stamp .ring{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 15px;
    letter-spacing: 0.14em;
    color: var(--green);
    border: 3px solid var(--green);
    border-radius: 10px;
    padding: 14px 20px;
    transform: rotate(-9deg) scale(0.7);
    background: rgba(255,253,248,0.92);
    text-align:center;
  }
  /* "SOLVED (BUT CHEATED!)" is far longer than "SOLVED" — let it wrap onto
     two lines inside the stamp instead of stretching it across the grid. */
  .stamp .ring.cheated{
    font-size:12px;
    max-width: 150px;
    line-height:1.35;
  }
  .stamp .ring.peeked{
    font-size:13px;
    max-width: 210px;
    line-height:1.3;
    letter-spacing: 0.05em;   /* the wide default tips this label onto 3 ragged lines */
  }
  .stamp .ring .time{
    display:block;
    font-size:12px;
    letter-spacing:0.05em;
    color: var(--ink-soft);
    margin-top:4px;
    font-weight:600;
  }
  .stamp.show{
    opacity:1;
    animation: stampin 0.45s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes stampin{
    0%{ opacity:0; transform:scale(1.4); }
    60%{ opacity:1; }
    100%{ opacity:1; transform:scale(1); }
  }
  .stamp.show .ring{
    animation: ringsettle 0.45s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes ringsettle{
    0%{ transform: rotate(-9deg) scale(0.4); }
    100%{ transform: rotate(-9deg) scale(1); }
  }

  footer{
    text-align:center;
    margin-top: 22px;
    font-size:11px;
    color: var(--ink-soft);
    opacity:0.7;
  }

  /* ---------- Phones ----------
     The only breakpoint here used to be 380px, but current iPhones report
     390-430px wide, so it never fired on any of them and the toolbar's five
     controls overflowed the card. 480px covers the whole phone range. */
  @media (max-width: 480px){
    body{ padding: 20px 12px 44px; }
    h1{ font-size:32px; }
    header{ margin-bottom:14px; }

    /* Timer keeps the first row; the controls get their own full-width row
       underneath rather than being squeezed off the edge. */
    .statusbar{
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }
    .statusbar .actions{ flex: 1 1 100%; gap:8px; }

    /* min-width:0 lets these shrink inside the flex row instead of forcing
       an overflow at the native control's intrinsic width. */
    #datePicker, #themeSelect{ flex:1 1 auto; min-width:0; }
    .iconbtn{ flex:0 0 auto; }

    /* Four actions don't fit across a phone — wrap them two-up. */
    .controls{ flex-wrap: wrap; gap:8px; margin-bottom:18px; }
    .controls button{ flex:1 1 calc(50% - 4px); }

    .clue-columns{ gap:12px; }
  }

  @media (max-width: 380px){
    h1{font-size:30px;}
    .clue-item{font-size:12.5px;}
  }

  .sr-input{
    position:absolute;
    opacity:0;
    pointer-events:none;
    height:1px;width:1px;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Vocab Mini</h1>
    <div class="date" id="dateLabel"></div>
    <div class="date" id="puzzleLabel" style="opacity:0.6; font-size:11px; margin-top:2px;"></div>
  </header>

  <div class="statusbar">
    <div class="timer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span id="timerLabel">0:00</span>
    </div>
    <div class="actions">
      <input type="date" id="datePicker" title="Play a previous day's puzzle" style="font-family:'Inter',sans-serif;font-size:12px;font-weight:600;border:1px solid var(--rule);border-radius:7px;padding:5px 8px;background:var(--paper-card);color:var(--ink);cursor:pointer;">
      <button class="iconbtn" id="todayBtn" title="Back to today's puzzle" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      </button>
      <select id="themeSelect" title="Choose a theme" style="font-family:'Inter',sans-serif;font-size:12px;font-weight:600;border:1px solid var(--rule);border-radius:7px;padding:5px 8px;background:var(--paper-card);color:var(--ink);cursor:pointer;"></select>
      <button class="iconbtn" id="rebusBtn" title="Restart puzzle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </div>

  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
    <div class="stamp" id="stamp">
      <div class="ring" id="stampRing"><span id="stampLabel">SOLVED</span>
        <span class="time" id="stampTime"></span>
      </div>
    </div>
  </div>

  <div class="share-row" id="shareRow" hidden>
    <button class="sharebtn" id="shareBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V3"/><path d="m8 7 4-4 4 4"/></svg>
      <span id="shareBtnLabel">Share result</span>
    </button>
  </div>

  <div class="active-clue">
    <div class="dir-toggle" id="dirToggle" title="Switch direction (or tap Tab)">A</div>
    <div class="text" id="clueText"><b>1A</b> —</div>
    <div class="nav">
      <button id="prevClue" title="Previous clue">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button id="nextClue" title="Next clue">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <div class="controls">
    <button id="checkBtn">Check</button>
    <button id="revealBtn">Reveal word</button>
    <button id="clearBtn">Clear</button>
    <button class="primary" id="solveBtn">Reveal all</button>
  </div>

  <div class="clue-columns">
    <div class="clue-col">
      <h2>Across</h2>
      <div id="acrossList"></div>
    </div>
    <div class="clue-col">
      <h2>Down</h2>
      <div id="downList"></div>
    </div>
  </div>

  <footer>Tap a square, type to fill, tab or tap the letter A/D badge to flip direction.</footer>
</div>

<input type="text" class="sr-input" id="hiddenInput" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">

<script>
/* ============================================================
   PUZZLE DATA — verified against a dictionary word list so every
   across and down entry is a real English word.
   Grid is 5x5. Black squares at (0,3) and (4,1) [row,col].
   ============================================================ */
const SIZE = 5;
const BLACKS = new Set(['0,3','4,1']);

/* Fixed template: every theme/puzzle uses this same black-square layout,
   so clue numbers/positions/lengths never change — only the answers and
   clue text differ per puzzle. This is what keeps adding themes simple:
   the grid-solving/rendering code below never has to change. */
const TEMPLATE = {
  across: [
    { num:1, row:0, col:0, len:3 },
    { num:5, row:1, col:0, len:5 },
    { num:7, row:2, col:0, len:5 },
    { num:8, row:3, col:0, len:5 },
    { num:9, row:4, col:2, len:3 },
  ],
  down: [
    { num:1, row:0, col:0, len:5 },
    { num:2, row:0, col:1, len:4 },
    { num:3, row:0, col:2, len:5 },
    { num:4, row:0, col:4, len:5 },
    { num:6, row:1, col:3, len:4 },
  ]
};

/* ============================================================
   THEMES — each entry points at a puzzles/<id>.json file: an array
   of puzzles in the same {across:{num:[WORD,clue]}, down:{...}} shape.
   Add a theme by adding a JSON file + one line here.
   ============================================================ */
const THEMES = [
  { id: 'general',      label: 'General' },
  { id: 'motorcycling', label: 'Motorcycling' },
];

const EPOCH_UTC = Date.UTC(2024, 0, 1); // fixed reference point so the rotation is stable across visits

/* All date maths is done in UTC day-numbers so a puzzle can't shift by one
   for players either side of midnight or in a different timezone. */
function todayUTC(){
  const n = new Date();
  return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
}

function toISODate(ts){
  const d = new Date(ts);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}

/* Parse YYYY-MM-DD strictly. Returns null for anything malformed or for
   impossible dates like 2026-02-31, which Date would otherwise roll over. */
function parseISODate(str){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || '');
  if(!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  const ts = Date.UTC(y, mo - 1, d);
  const back = new Date(ts);
  if(back.getUTCFullYear() !== y || back.getUTCMonth() !== mo - 1 || back.getUTCDate() !== d) return null;
  return ts;
}

/* Clamp any requested day into [EPOCH_UTC, today]. The date picker's max
   attribute stops most forward travel, but the ?date= param is editable by
   hand, so the clamp here is what actually guarantees no future puzzles. */
function clampToPlayableDay(ts){
  const today = todayUTC();
  if(ts === null || Number.isNaN(ts)) return today;
  if(ts > today) return today;
  if(ts < EPOCH_UTC) return EPOCH_UTC;
  return ts;
}

function puzzleIndexForDate(ts, bankLength){
  const daysSince = Math.floor((ts - EPOCH_UTC) / 86400000);
  return ((daysSince % bankLength) + bankLength) % bankLength;
}

function buildPuzzle(bankEntry){
  const across = TEMPLATE.across.map(t => ({ ...t, answer: bankEntry.across[t.num][0], text: bankEntry.across[t.num][1] }));
  const down   = TEMPLATE.down.map(t => ({ ...t, answer: bankEntry.down[t.num][0], text: bankEntry.down[t.num][1] }));
  const solution = Array.from({length:SIZE}, (_,r)=> Array.from({length:SIZE}, (_,c)=> BLACKS.has(r+','+c) ? '#' : ''));
  across.forEach(cl=>{ for(let i=0;i<cl.len;i++) solution[cl.row][cl.col+i] = cl.answer[i]; });
  down.forEach(cl=>{ for(let i=0;i<cl.len;i++) solution[cl.row+i][cl.col] = cl.answer[i]; });
  return { solution, clues: { across, down } };
}

let SOLUTION, CLUES, PUZZLE_INDEX, PUZZLE_BANK_LEN;

/* ============================================================
   BUILD GRID MODEL
   ============================================================ */
function startGame(){
function key(r,c){ return r+','+c; }

const numberAt = {};
(function assignNumbers(){
  [...CLUES.across, ...CLUES.down].forEach(cl=>{
    numberAt[key(cl.row, cl.col)] = cl.num;
  });
})();

// map every cell -> which across/down clue it belongs to
const cellAcross = {}; // key -> clue obj
const cellDown = {};
CLUES.across.forEach(cl=>{
  for(let i=0;i<cl.len;i++) cellAcross[key(cl.row, cl.col+i)] = cl;
});
CLUES.down.forEach(cl=>{
  for(let i=0;i<cl.len;i++) cellDown[key(cl.row+i, cl.col)] = cl;
});

const state = {
  entries: {}, // key -> letter typed
  selected: {r:0,c:0},
  dir: 'across',
  startTime: null,
  timerInterval: null,
  solved: false,
  cheated: false,   // set by "Reveal all"  — the whole grid was given away
  peeked:  new Set(),  // which words "Reveal word" gave away, as "dir:num".
                       // A set, not a tally: revealing the same answer twice
                       // is no more help than revealing it once.
  checkedWrong: new Set(),
};

/* ============================================================
   RENDER GRID
   ============================================================ */
const gridEl = document.getElementById('grid');
const cells = {};

for(let r=0;r<SIZE;r++){
  for(let c=0;c<SIZE;c++){
    const k = key(r,c);
    const div = document.createElement('div');
    if(BLACKS.has(k)){
      div.className = 'cell black';
    } else {
      div.className = 'cell';
      if(numberAt[k]){
        const num = document.createElement('div');
        num.className = 'num';
        num.textContent = numberAt[k];
        div.appendChild(num);
      }
      const letter = document.createElement('div');
      letter.className = 'letter';
      div.appendChild(letter);
      div.addEventListener('click', ()=> selectCell(r,c));
    }
    div.dataset.r = r; div.dataset.c = c;
    gridEl.appendChild(div);
    cells[k] = div;
  }
}

/* ============================================================
   CLUE LISTS
   ============================================================ */
const acrossListEl = document.getElementById('acrossList');
const downListEl = document.getElementById('downList');

function renderClueList(){
  acrossListEl.innerHTML = '';
  downListEl.innerHTML = '';
  CLUES.across.forEach(cl=>{
    acrossListEl.appendChild(makeClueItem(cl,'across'));
  });
  CLUES.down.forEach(cl=>{
    downListEl.appendChild(makeClueItem(cl,'down'));
  });
}

function makeClueItem(cl, dir){
  const item = document.createElement('div');
  item.className = 'clue-item';
  item.dataset.num = cl.num;
  item.dataset.dir = dir;
  item.innerHTML = `<b>${cl.num}</b><span>${cl.text}</span>`;
  item.addEventListener('click', ()=>{
    state.dir = dir;
    selectCell(cl.row, cl.col, true);
  });
  return item;
}
renderClueList();

/* ============================================================
   SELECTION / DIRECTION
   ============================================================ */
const hiddenInput = document.getElementById('hiddenInput');

function isBlack(r,c){ return BLACKS.has(key(r,c)); }
function inBounds(r,c){ return r>=0 && r<SIZE && c>=0 && c<SIZE; }

function currentClue(){
  const k = key(state.selected.r, state.selected.c);
  return state.dir === 'across' ? cellAcross[k] : cellDown[k];
}

function selectCell(r,c, forceKeepDir){
  if(isBlack(r,c)) return;
  const sameCell = state.selected.r===r && state.selected.c===c;
  if(sameCell && !forceKeepDir){
    // toggle direction if possible
    const k = key(r,c);
    if(cellAcross[k] && cellDown[k]) state.dir = state.dir === 'across' ? 'down' : 'across';
  } else {
    // choose a sensible direction if current one has no word here
    const k = key(r,c);
    if(state.dir==='across' && !cellAcross[k] && cellDown[k]) state.dir = 'down';
    if(state.dir==='down' && !cellDown[k] && cellAcross[k]) state.dir = 'across';
  }
  state.selected = {r,c};
  hiddenInput.focus({preventScroll:true});
  render();
  startTimerIfNeeded();
}

/* ============================================================
   RENDER STATE (selection highlight, letters, clue banner)
   ============================================================ */
function render(){
  const activeClue = currentClue();
  const activeCells = new Set();
  if(activeClue){
    for(let i=0;i<activeClue.len;i++){
      const rr = activeClue.row + (state.dir==='down'? i:0);
      const cc = activeClue.col + (state.dir==='across'? i:0);
      activeCells.add(key(rr,cc));
    }
  }

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      const k = key(r,c);
      if(isBlack(r,c)) continue;
      const div = cells[k];
      div.classList.toggle('selected', r===state.selected.r && c===state.selected.c);
      div.classList.toggle('word-hl', activeCells.has(k) && !(r===state.selected.r && c===state.selected.c));
      const letterEl = div.querySelector('.letter');
      letterEl.textContent = state.entries[k] || '';
    }
  }

  // clue banner
  const dirToggle = document.getElementById('dirToggle');
  dirToggle.textContent = state.dir === 'across' ? 'A' : 'D';
  const clueText = document.getElementById('clueText');
  if(activeClue){
    const label = `${activeClue.num}${state.dir==='across'?'A':'D'}`;
    clueText.innerHTML = `<b>${label}</b> ${activeClue.text}`;
  }

  // clue list active + done states
  document.querySelectorAll('.clue-item').forEach(item=>{
    const num = parseInt(item.dataset.num);
    const dir = item.dataset.dir;
    item.classList.toggle('active', activeClue && activeClue.num===num && dir===state.dir);
    const cl = (dir==='across'?CLUES.across:CLUES.down).find(x=>x.num===num);
    let filled = '';
    for(let i=0;i<cl.len;i++){
      const rr = cl.row + (dir==='down'?i:0);
      const cc = cl.col + (dir==='across'?i:0);
      filled += state.entries[key(rr,cc)] || '';
    }
    item.classList.toggle('done', filled.toUpperCase() === cl.answer);
  });
}

/* ============================================================
   TYPING / KEYBOARD NAVIGATION
   ============================================================ */
function moveTo(r,c){
  if(!inBounds(r,c)) return false;
  if(isBlack(r,c)) return false;
  state.selected = {r,c};
  return true;
}

function step(forward){
  const dr = state.dir==='down' ? (forward?1:-1) : 0;
  const dc = state.dir==='across' ? (forward?1:-1) : 0;
  let r = state.selected.r + dr, c = state.selected.c + dc;
  if(moveTo(r,c)) return true;
  return false;
}

function nextCellInWordOrJump(){
  if(step(true)) { render(); return; }
  jumpToClue(1);
}

function jumpToClue(delta){
  const all = [...CLUES.across.map(c=>({...c,dir:'across'})), ...CLUES.down.map(c=>({...c,dir:'down'}))]
    .sort((a,b)=> a.num-b.num || (a.dir>b.dir?1:-1));
  const cur = currentClue();
  let idx = all.findIndex(cl=> cur && cl.num===cur.num && cl.dir===state.dir);
  if(idx === -1) idx = 0;
  idx = (idx + delta + all.length) % all.length;
  const target = all[idx];
  state.dir = target.dir;
  state.selected = {r:target.row, c:target.col};
  render();
}

document.getElementById('prevClue').addEventListener('click', ()=>jumpToClue(-1));
document.getElementById('nextClue').addEventListener('click', ()=>jumpToClue(1));
document.getElementById('dirToggle').addEventListener('click', ()=>{
  const k = key(state.selected.r, state.selected.c);
  if(cellAcross[k] && cellDown[k]) state.dir = state.dir==='across'?'down':'across';
  render();
});

hiddenInput.addEventListener('keydown', (e)=>{
  const {r,c} = state.selected;
  if(e.key === 'ArrowRight'){ e.preventDefault(); state.dir='across'; moveTo(r,c+1); render(); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); state.dir='across'; moveTo(r,c-1); render(); }
  else if(e.key === 'ArrowDown'){ e.preventDefault(); state.dir='down'; moveTo(r+1,c); render(); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); state.dir='down'; moveTo(r-1,c); render(); }
  else if(e.key === 'Tab'){ e.preventDefault(); jumpToClue(e.shiftKey?-1:1); }
  else if(e.key === 'Backspace'){
    e.preventDefault();
    const k = key(r,c);
    if(state.entries[k]){
      delete state.entries[k];
      render();
    } else {
      step(false);
      const k2 = key(state.selected.r, state.selected.c);
      delete state.entries[k2];
      render();
    }
    checkSolved();
  }
  else if(/^[a-zA-Z]$/.test(e.key)){
    e.preventDefault();
    const k = key(r,c);
    state.entries[k] = e.key.toUpperCase();
    const cellEl = cells[k];
    cellEl.classList.remove('incorrect','correct','revealed');
    render();
    nextCellInWordOrJump();
    checkSolved();
  }
});

// keep hidden input focused for mobile keyboards
gridEl.addEventListener('click', ()=> hiddenInput.focus({preventScroll:true}));
document.body.addEventListener('click', (e)=>{
  if(!e.target.closest('.grid') && !e.target.closest('button')) {
    // don't steal focus from other interactions
  }
});

/* ============================================================
   TIMER
   ============================================================ */
const timerLabel = document.getElementById('timerLabel');
function startTimerIfNeeded(){
  if(state.startTime || state.solved) return;
  state.startTime = Date.now();
  state.timerInterval = setInterval(updateTimer, 500);
}
function updateTimer(){
  const secs = Math.floor((Date.now()-state.startTime)/1000);
  const m = Math.floor(secs/60), s = secs%60;
  timerLabel.textContent = `${m}:${s.toString().padStart(2,'0')}`;
}
function stopTimer(){
  clearInterval(state.timerInterval);
}
function currentTimeLabel(){ return timerLabel.textContent; }

/* ============================================================
   SHARE — three lines: the game, the day played, the solve time.
   Uses the native share sheet where there is one (iOS/Android), and
   falls back to the clipboard on desktop browsers that lack it.
   ============================================================ */
/* Reveal all outranks Reveal word: if both were used, the grid was still
   handed over wholesale, so it gets the stronger verdict. */
function solveVerdict(){
  if(state.cheated) return { stamp:'SOLVED (BUT CHEATED!)', share:'Solved (but cheated!)', soft:false };
  const peeks = state.peeked.size;
  if(peeks === 1) return { stamp:'SOLVED-cheated a bit', share:'Solved-cheated a bit', soft:true };
  if(peeks > 1){
    const n = `cheated ${peeks} times`;
    return { stamp:`SOLVED-${n}`, share:`Solved-${n}`, soft:true };
  }
  return { stamp:'SOLVED', share:'Solved', soft:false };
}

function shareText(){
  const day = new Date(SELECTED_DAY).toLocaleDateString('en-US',
    { weekday:'long', month:'long', day:'numeric', year:'numeric', timeZone:'UTC' });
  return `Vocab Mini\n${day}\n${solveVerdict().share} in ${currentTimeLabel()}`;
}

const shareRow = document.getElementById('shareRow');
const shareBtnLabel = document.getElementById('shareBtnLabel');
let shareLabelTimer = null;

function flashShareLabel(msg){
  clearTimeout(shareLabelTimer);
  shareBtnLabel.textContent = msg;
  shareLabelTimer = setTimeout(()=>{ shareBtnLabel.textContent = 'Share result'; }, 2000);
}

document.getElementById('shareBtn').addEventListener('click', async ()=>{
  const text = shareText();
  try{
    if(navigator.share){
      await navigator.share({ text });
      return;
    }
    await navigator.clipboard.writeText(text);
    flashShareLabel('Copied');
  }catch(err){
    /* AbortError just means the user dismissed the share sheet — not a
       failure, and not worth surfacing. Anything else falls back to a
       manual copy so the result is never trapped in the page. */
    if(err && err.name === 'AbortError') return;
    try{
      await navigator.clipboard.writeText(text);
      flashShareLabel('Copied');
    }catch(_){
      window.prompt('Copy your result:', text.replace(/\n/g, ' — '));
    }
  }
});

/* ============================================================
   CHECK / REVEAL / CLEAR
   ============================================================ */
document.getElementById('checkBtn').addEventListener('click', ()=>{
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      const k = key(r,c);
      if(isBlack(r,c)) continue;
      const div = cells[k];
      div.classList.remove('correct','incorrect');
      if(!state.entries[k]) continue;
      if(state.entries[k] === SOLUTION[r][c]) div.classList.add('correct');
      else div.classList.add('incorrect');
    }
  }
  setTimeout(()=>{
    document.querySelectorAll('.cell.incorrect').forEach(d=>d.classList.remove('incorrect'));
  }, 1200);
});

document.getElementById('revealBtn').addEventListener('click', ()=>{
  const cl = currentClue();
  if(!cl) return;
  for(let i=0;i<cl.len;i++){
    const rr = cl.row + (state.dir==='down'?i:0);
    const cc = cl.col + (state.dir==='across'?i:0);
    const k = key(rr,cc);
    state.entries[k] = SOLUTION[rr][cc];
    cells[k].classList.add('revealed');
    cells[k].classList.remove('incorrect');
  }
  state.peeked.add(`${state.dir}:${cl.num}`);
  render();
  checkSolved();
});

document.getElementById('solveBtn').addEventListener('click', ()=>{
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      if(isBlack(r,c)) continue;
      const k = key(r,c);
      state.entries[k] = SOLUTION[r][c];
      cells[k].classList.add('revealed');
    }
  }
  state.cheated = true;
  render();
  checkSolved();
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  const cl = currentClue();
  if(!cl) return;
  for(let i=0;i<cl.len;i++){
    const rr = cl.row + (state.dir==='down'?i:0);
    const cc = cl.col + (state.dir==='across'?i:0);
    const k = key(rr,cc);
    delete state.entries[k];
    cells[k].classList.remove('correct','incorrect','revealed');
  }
  render();
});

document.getElementById('rebusBtn').addEventListener('click', ()=>{
  if(!confirm('Restart the puzzle? This clears all your progress.')) return;
  state.entries = {};
  state.solved = false;
  state.cheated = false;
  state.peeked = new Set();
  state.startTime = null;
  stopTimer();
  timerLabel.textContent = '0:00';
  document.getElementById('stamp').classList.remove('show');
  shareRow.hidden = true;
  document.querySelectorAll('.cell').forEach(d=>d.classList.remove('correct','incorrect','revealed'));
  render();
});

/* ============================================================
   SOLVE DETECTION
   ============================================================ */
function checkSolved(){
  if(state.solved) return;
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      if(isBlack(r,c)) continue;
      const k = key(r,c);
      if((state.entries[k]||'') !== SOLUTION[r][c]) return;
    }
  }
  state.solved = true;
  stopTimer();
  const verdict = solveVerdict();
  document.getElementById('stampLabel').textContent = verdict.stamp;
  document.getElementById('stampRing').classList.toggle('cheated', state.cheated);
  document.getElementById('stampRing').classList.toggle('peeked', verdict.soft);
  document.getElementById('stampTime').textContent = currentTimeLabel();
  document.getElementById('stamp').classList.add('show');
  shareBtnLabel.textContent = 'Share result';
  shareRow.hidden = false;
  document.querySelectorAll('.cell').forEach(d=>{
    if(!d.classList.contains('black')) d.classList.add('correct');
  });
}

/* ============================================================
   INIT
   ============================================================ */
document.getElementById('dateLabel').textContent = new Date(SELECTED_DAY).toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric', timeZone:'UTC' });
document.getElementById('puzzleLabel').textContent =
  `Puzzle ${PUZZLE_INDEX + 1} of ${PUZZLE_BANK_LEN}` + (SELECTED_DAY === todayUTC() ? '' : ' · from the archive');
selectCell(0,0,true);
hiddenInput.focus();
}

/* ============================================================
   BOOT — pick the theme (from ?theme= or default), fetch its
   puzzle bank, resolve today's puzzle, then start the game.
   A theme switch just reloads with a new ?theme= — simplest
   thing that works, and keeps the game logic above untouched.
   ============================================================ */
const params = new URLSearchParams(location.search);
const CURRENT_THEME = THEMES.some(t => t.id === params.get('theme')) ? params.get('theme') : THEMES[0].id;

const themeSelect = document.getElementById('themeSelect');
THEMES.forEach(t=>{
  const opt = document.createElement('option');
  opt.value = t.id; opt.textContent = t.label;
  if(t.id === CURRENT_THEME) opt.selected = true;
  themeSelect.appendChild(opt);
});
themeSelect.addEventListener('change', ()=>{
  const url = new URL(location.href);
  url.searchParams.set('theme', themeSelect.value);
  location.href = url.toString();
});

/* ---- Date picker: play any past day, never a future one ----
   ?date=YYYY-MM-DD selects the day. Anything missing, malformed or in the
   future falls back to today via clampToPlayableDay(), so a hand-edited URL
   can't reach tomorrow's puzzle. Changing the date reloads with a new
   ?date=, mirroring how the theme switch already works. */
const SELECTED_DAY = clampToPlayableDay(parseISODate(params.get('date')));
const IS_TODAY = SELECTED_DAY === todayUTC();

const datePicker = document.getElementById('datePicker');
datePicker.min = toISODate(EPOCH_UTC);
datePicker.max = toISODate(todayUTC());   // browser-level block on forward travel
datePicker.value = toISODate(SELECTED_DAY);

datePicker.addEventListener('change', ()=>{
  const picked = clampToPlayableDay(parseISODate(datePicker.value));
  const url = new URL(location.href);
  if(picked === todayUTC()) url.searchParams.delete('date');  // keep today's URL clean
  else url.searchParams.set('date', toISODate(picked));
  location.href = url.toString();
});

/* A one-tap way back to today, shown only when it would do something. */
const todayBtn = document.getElementById('todayBtn');
todayBtn.hidden = IS_TODAY;
todayBtn.addEventListener('click', ()=>{
  const url = new URL(location.href);
  url.searchParams.delete('date');
  location.href = url.toString();
});

/* If the URL asked for a day we had to clamp, correct the address bar so a
   refresh or a shared link doesn't keep re-triggering the clamp. */
if(params.get('date') && params.get('date') !== toISODate(SELECTED_DAY)){
  const url = new URL(location.href);
  if(IS_TODAY) url.searchParams.delete('date');
  else url.searchParams.set('date', toISODate(SELECTED_DAY));
  history.replaceState(null, '', url.toString());
}

fetch(`puzzles/${CURRENT_THEME}.json`)
  .then(res => { if(!res.ok) throw new Error(`${res.status}`); return res.json(); })
  .then(bank => {
    PUZZLE_BANK_LEN = bank.length;
    PUZZLE_INDEX = puzzleIndexForDate(SELECTED_DAY, PUZZLE_BANK_LEN);
    ({ solution: SOLUTION, clues: CLUES } = buildPuzzle(bank[PUZZLE_INDEX]));
    startGame();
  })
  .catch(err => {
    document.getElementById('grid').innerHTML =
      `<div style="grid-column:1/-1;padding:20px;font-size:13px;color:var(--ink-soft);">
        Couldn't load puzzles/${CURRENT_THEME}.json (${err.message}).
        This page needs to run from a web server (GitHub Pages, or
        <code>python -m http.server</code> locally) — opening index.html
        directly as a file won't allow it to fetch the puzzle data.
      </div>`;
  });
</script>
